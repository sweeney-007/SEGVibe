[project]
name = "segvibe"
version = "0.1.0"
description = "Generate C code from a written requirement, then check it for bugs, leaks, resource overuse, vulnerabilities and crashes, and repair it"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
    "langgraph>=0.6",
    # retrieval (and local models); torch 2.2.2 is the last release with Intel Mac wheels
    "torch==2.2.2",
    "numpy<2",
    "transformers>=4.45,<5",
    "sentence-transformers>=3.0,<5",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Local code LLM on CPU (Qwen2.5-Coder); torch 2.2.2 is the last release with Intel Mac wheels
local = [
    "accelerate>=0.34",
]
# Hosted LLMs through LangChain (keys in .env)
api = [
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "python-dotenv>=1.0",
]

[project.scripts]
segvibe = "segvibe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["segvibe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
