name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: clang --version
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python scripts/validate_tasks.py
