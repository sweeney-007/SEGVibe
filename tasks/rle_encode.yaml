id: rle_encode
title: Run-length encode a string
tags: [strings, buffer-sizing]
requirement: |
  Write a C function that run-length encodes `s`: each maximal run of the
  same character becomes that character followed by the run length in
  decimal (for example "aaabcc" -> "a3b1c2" and twelve 'z' -> "z12").
  The input contains no digits. Return a newly allocated string, or NULL
  if `s` is NULL or allocation fails. The caller frees the result.
signature: char *rle_encode(const char *s);
complexity: 1
reference: |
  #include <stdio.h>
  #include <stdlib.h>
  #include <string.h>

  char *rle_encode(const char *s) {
      if (!s) return NULL;
      size_t n = strlen(s);
      char *out = malloc(2 * n + 1);
      if (!out) return NULL;
      size_t o = 0;
      for (size_t i = 0; i < n;) {
          size_t j = i;
          while (j < n && s[j] == s[i]) j++;
          out[o++] = s[i];
          o += (size_t)snprintf(out + o, 2 * n + 1 - o, "%zu", j - i);
          i = j;
      }
      out[o] = '\0';
      return out;
  }
tests: |
  char *r;
  r = rle_encode("aaabcc");
  CHECK_STR(r, "a3b1c2");
  free(r);
  r = rle_encode("");
  CHECK_STR(r, "");
  free(r);
  r = rle_encode("a");
  CHECK_STR(r, "a1");
  free(r);
  r = rle_encode("zzzzzzzzzzzz");
  CHECK_STR(r, "z12");
  free(r);
  r = rle_encode("abab");
  CHECK_STR(r, "a1b1a1b1");
  free(r);
  CHECK(rle_encode(NULL) == NULL);
fuzz: |
  char *s = segv_rand_str(60, "aaab");
  char *r = rle_encode(s);
  if (r) {
      size_t k = 0;
      int ok = 1;
      const char *p = r;
      while (*p && ok) {
          char c = *p++;
          if (!isdigit((unsigned char)*p)) {
              ok = 0;
              break;
          }
          size_t cnt = 0;
          while (isdigit((unsigned char)*p)) cnt = cnt * 10 + (size_t)(*p++ - '0');
          for (size_t t = 0; t < cnt && ok; t++) ok = s[k] == c && s[k] != 0, k++;
      }
      CHECK(ok && s[k] == '\0');
      free(r);
  }
  free(s);
perf: |
  char *s = segv_rand_str_n((size_t)N, "aab");
  char *r = rle_encode(s);
  if (r) segv_sink += r[0];
  free(r);
  free(s);
perf_n0: 10000
variants:
  - kind: vuln
    note: allocates n + 2 bytes, assuming the output is never much longer than the input
    code: |
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>

      char *rle_encode(const char *s) {
          if (!s) return NULL;
          size_t n = strlen(s);
          char *out = malloc(n + 2);
          if (!out) return NULL;
          size_t o = 0;
          for (size_t i = 0; i < n;) {
              size_t j = i;
              while (j < n && s[j] == s[i]) j++;
              out[o++] = s[i];
              o += (size_t)sprintf(out + o, "%zu", j - i);
              i = j;
          }
          out[o] = '\0';
          return out;
      }
  - kind: bug
    note: writes the count as a single digit, wrong for runs of 10 or more
    code: |
      #include <stdlib.h>
      #include <string.h>

      char *rle_encode(const char *s) {
          if (!s) return NULL;
          size_t n = strlen(s);
          char *out = malloc(2 * n + 1);
          if (!out) return NULL;
          size_t o = 0;
          for (size_t i = 0; i < n;) {
              size_t j = i;
              while (j < n && s[j] == s[i]) j++;
              out[o++] = s[i];
              out[o++] = (char)('0' + (j - i) % 10);
              i = j;
          }
          out[o] = '\0';
          return out;
      }
