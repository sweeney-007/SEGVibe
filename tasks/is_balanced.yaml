id: is_balanced
title: Check balanced brackets
tags: [parsing, untrusted-input, stack]
requirement: |
  Write a C function that returns 1 if the brackets (), [] and {} in `s`
  are balanced and properly nested, and 0 otherwise; other characters are
  ignored. The input is untrusted and can be millions of characters long
  with arbitrarily deep nesting, so do not use a fixed-size stack or
  recursion. Return 0 if `s` is NULL and -1 if memory allocation fails.
signature: int is_balanced(const char *s);
complexity: 1
reference: |
  #include <stdlib.h>

  int is_balanced(const char *s) {
      if (!s) return 0;
      size_t n = 0;
      for (const char *p = s; *p; p++)
          if (*p == '(' || *p == '[' || *p == '{') n++;
      char *st = malloc(n + 1);
      if (!st) return -1;
      size_t top = 0;
      int ok = 1;
      for (const char *p = s; *p && ok; p++) {
          char c = *p;
          if (c == '(' || c == '[' || c == '{') {
              st[top++] = c;
          } else if (c == ')' || c == ']' || c == '}') {
              char want = c == ')' ? '(' : c == ']' ? '[' : '{';
              if (top == 0 || st[--top] != want) ok = 0;
          }
      }
      ok = ok && top == 0;
      free(st);
      return ok;
  }
helpers: |
  static int ref_balanced(const char *s) {
      size_t n = strlen(s), top = 0;
      char *st = malloc(n + 1);
      int ok = 1;
      for (const char *p = s; *p && ok; p++) {
          char c = *p;
          if (c == '(' || c == '[' || c == '{') st[top++] = c;
          else if (c == ')' || c == ']' || c == '}') {
              char want = c == ')' ? '(' : c == ']' ? '[' : '{';
              if (top == 0 || st[--top] != want) ok = 0;
          }
      }
      free(st);
      return ok && top == 0;
  }

  static char *nested(size_t depth) {
      char *s = malloc(2 * depth + 1);
      for (size_t i = 0; i < depth; i++) {
          s[i] = "([{"[i % 3];
          s[2 * depth - 1 - i] = ")]}"[i % 3];
      }
      s[2 * depth] = 0;
      return s;
  }
tests: |
  CHECK_INT(is_balanced(""), 1);
  CHECK_INT(is_balanced("()"), 1);
  CHECK_INT(is_balanced("([]{})"), 1);
  CHECK_INT(is_balanced("a(b)c"), 1);
  CHECK_INT(is_balanced("(]"), 0);
  CHECK_INT(is_balanced("(("), 0);
  CHECK_INT(is_balanced("())"), 0);
  CHECK_INT(is_balanced("}{"), 0);
  CHECK_INT(is_balanced(NULL), 0);
  char *deep = nested(100000);
  CHECK_INT(is_balanced(deep), 1);
  deep[0] = '[';
  CHECK_INT(is_balanced(deep), 0);
  free(deep);
fuzz: |
  char *s = segv_rand_int(0, 3) ? segv_rand_str(300, "()[]{}a") : nested((size_t)segv_rand_int(200, 3000));
  int rc = is_balanced(s);
  if (rc >= 0) CHECK_INT(rc, ref_balanced(s));
  free(s);
perf: |
  char *s = nested((size_t)N);
  segv_sink += is_balanced(s);
  free(s);
perf_n0: 10000
variants:
  - kind: vuln
    note: uses a fixed 256-byte stack with no bounds check
    code: |
      int is_balanced(const char *s) {
          if (!s) return 0;
          char st[256];
          int top = 0;
          for (const char *p = s; *p; p++) {
              char c = *p;
              if (c == '(' || c == '[' || c == '{') {
                  st[top++] = c;
              } else if (c == ')' || c == ']' || c == '}') {
                  char want = c == ')' ? '(' : c == ']' ? '[' : '{';
                  if (top == 0 || st[--top] != want) return 0;
              }
          }
          return top == 0;
      }
