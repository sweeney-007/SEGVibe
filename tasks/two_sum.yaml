          Pair *p = malloc(n * sizeof *p);
          if (!p) return -1;
          for (size_t k = 0; k < n; k++) p[k] = (Pair){a[k], k};
          qsort(p, n, sizeof *p, cmp_pair);
          size_t lo = 0, hi = n - 1;
          int found = 0;
          while (lo < hi) {
              int s = p[lo].v + p[hi].v;
              if (s == target) {
                  found = 1;
                  break;
              }
              if (s < target) lo++;
              else hi--;
          }
          if (found) {
              size_t x = p[lo].i, y = p[hi].i;
              *i = x < y ? x : y;
              *j = x < y ? y : x;
          }
          free(p);
          return found;
      }
