id: base64_encode
title: Base64-encode bytes
tags: [bytes, buffer-sizing]
requirement: |
  Write a C function that base64-encodes `n` bytes from `data` with the
  standard alphabet (A-Z, a-z, 0-9, +, /) and "=" padding, so the output
  is always 4 * ceil(n / 3) characters. `data` may be NULL only when `n`
  is 0 (the result is then ""). Return a newly allocated string, or NULL
  on invalid arguments or allocation failure. The caller frees the result.
signature: char *base64_encode(const unsigned char *data, size_t n);
complexity: 1
reference: |
  #include <stdlib.h>

  char *base64_encode(const unsigned char *data, size_t n) {
      static const char tbl[] = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
      if (!data && n) return NULL;
      size_t len = (n + 2) / 3 * 4;
      char *out = malloc(len + 1);
      if (!out) return NULL;
      size_t o = 0, i = 0;
      for (; i + 2 < n; i += 3) {
          unsigned v = (unsigned)data[i] << 16 | (unsigned)data[i + 1] << 8 | data[i + 2];
          out[o++] = tbl[v >> 18 & 63];
          out[o++] = tbl[v >> 12 & 63];
          out[o++] = tbl[v >> 6 & 63];
          out[o++] = tbl[v & 63];
      }
      if (i < n) {
          unsigned v = (unsigned)data[i] << 16 | (i + 1 < n ? (unsigned)data[i + 1] << 8 : 0);
          out[o++] = tbl[v >> 18 & 63];
          out[o++] = tbl[v >> 12 & 63];
          out[o++] = i + 1 < n ? tbl[v >> 6 & 63] : '=';
          out[o++] = '=';
      }
      out[o] = '\0';
      return out;
  }
tests: |
  char *r;
  r = base64_encode((const unsigned char *)"", 0);
  CHECK_STR(r, "");
  free(r);
  r = base64_encode((const unsigned char *)"f", 1);
  CHECK_STR(r, "Zg==");
  free(r);
  r = base64_encode((const unsigned char *)"fo", 2);
  CHECK_STR(r, "Zm8=");
  free(r);
  r = base64_encode((const unsigned char *)"foo", 3);
  CHECK_STR(r, "Zm9v");
  free(r);
  r = base64_encode((const unsigned char *)"foobar", 6);
  CHECK_STR(r, "Zm9vYmFy");
  free(r);
  unsigned char ff[] = {0xff, 0xfe};
  r = base64_encode(ff, 2);
  CHECK_STR(r, "//4=");
  free(r);
  CHECK(base64_encode(NULL, 3) == NULL);
fuzz: |
  size_t n = (size_t)segv_rand_int(0, 20);
  unsigned char *d = malloc(n ? n : 1);
  for (size_t i = 0; i < n; i++) d[i] = (unsigned char)segv_rand();
  char *r = base64_encode(d, n);
  if (r) {
      CHECK(strlen(r) == (n + 2) / 3 * 4);
      CHECK(strspn(r, "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=") == strlen(r));
      free(r);
  }
  free(d);
perf: |
  unsigned char *d = malloc((size_t)N);
  for (long i = 0; i < N; i++) d[i] = (unsigned char)i;
  char *r = base64_encode(d, (size_t)N);
  if (r) segv_sink += r[0];
  free(r);
  free(d);
perf_n0: 10000
variants:
  - kind: vuln
    note: forgets the padded final group when sizing the output
